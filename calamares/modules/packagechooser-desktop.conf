---
# One simple decision; the actual package changes are made by installer-desktop.sh.
mode: required
method: legacy
default: plasma
labels:
  step: "Desktop"
  step[ru]: "Рабочий стол"
items:
  - id: plasma
    name: "KDE Plasma (recommended)"
    name[ru]: "KDE Plasma (рекомендуется)"
    description: "Modern, customizable Wayland desktop. Ready out of the box."
    description[ru]: "Современный настраиваемый рабочий стол с Wayland."
    screenshot: "/etc/calamares/branding/veyra/desktop-plasma.svg"
  - id: gnome
    name: "GNOME"
    description: "Clean and distraction-free desktop, with Wayland."
    description[ru]: "Простой современный интерфейс с Wayland."
    screenshot: "/etc/calamares/branding/veyra/desktop-gnome.svg"
  - id: xfce
    name: "Xfce"
    description: "Lightweight and traditional desktop using X11."
    description[ru]: "Лёгкий классический рабочий стол на X11."
    screenshot: "/etc/calamares/branding/veyra/desktop-xfce.svg"
  - id: lxqt
    name: "LXQt"
    description: "Fast and minimalist desktop using X11."
    description[ru]: "Очень лёгкий и быстрый рабочий стол на X11."
    screenshot: "/etc/calamares/branding/veyra/desktop-lxqt.svg"
  - id: minimal
    name: "Minimal system (console only)"
    name[ru]: "Минимальная система без графики"
    description: "A console-first system without a desktop environment or display manager."
    description[ru]: "Система с консолью без рабочего стола и менеджера входа."
    screenshot: "/etc/calamares/branding/veyra/desktop-minimal.svg"
