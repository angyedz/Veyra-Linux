---
initdDir: /etc/init.d
runlevelsDir: /etc/runlevels
services:
  - name: dbus
    mandatory: true
  - name: elogind
    mandatory: true
  - name: networkmanager
    mandatory: true
  # The chosen desktop enables its own display manager at install time.
  - name: nix-daemon
    mandatory: false
disable:
  - name: veyra-live
    runlevel: boot
