---
modules-search: [ local ]
instances:
  - id: copy
    module: shellprocess
    config: shellprocess-copy.conf
  - id: prepare
    module: shellprocess
    config: shellprocess-prepare.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@copy
      - shellprocess@prepare
      - locale
      - keyboard
      - fstab
      - users
      - services-openrc
      - bootloader
      - umount
  - show:
      - finished
branding: veyra
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
