name: Veyra Atomic A/B (cached ISO)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/veyra-atomic-convert.sh'
      - 'scripts/build-veyra-init.sh'
      - 'scripts/veyra-initramfs-select.sh'
      - 'scripts/veyra-bootctl.py'
      - 'scripts/veyra-deployment.sh'
      - 'tests/test-atomic-qemu.py'
      - 'tests/test-installed-qemu.py'
      - '.github/workflows/atomic-e2e.yml'
  pull_request:
    paths:
      - 'scripts/veyra-atomic-convert.sh'
      - 'scripts/build-veyra-init.sh'
      - 'scripts/veyra-initramfs-select.sh'
      - 'scripts/veyra-bootctl.py'
      - 'scripts/veyra-deployment.sh'
      - 'tests/test-atomic-qemu.py'
      - 'tests/test-installed-qemu.py'
      - '.github/workflows/atomic-e2e.yml'
  workflow_dispatch:

concurrency:
  group: veyra-atomic-qemu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  atomic-ext4:
    name: Real ext4 A to B to rollback A in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find newest still-available ISO created on main
        id: iso
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=veyra-linux-iso&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo 'No unexpired main-branch ISO artifact, run Veyra ISO workflow.' >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.iso.outputs.run_id }}
          github-token: ${{ github.token }}
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU serial and installer test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect
      - name: Validate boot automation and ISO checksums
        run: |
          python3 -m py_compile tests/test-atomic-qemu.py tests/test-installed-qemu.py
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
      - name: Real Alpine+Plasma A/B boot and rollback
        shell: bash
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          python3 tests/test-atomic-qemu.py "$iso" --log-dir atomic-qemu-logs
      - name: Preserve A/B GRUB, initramfs and serial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-atomic-qemu-ext4-logs
          path: atomic-qemu-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
