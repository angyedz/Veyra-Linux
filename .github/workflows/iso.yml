name: Veyra ISO
concurrency:
  group: veyra-iso-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'calamares/**'
      - 'packaging/calamares/**'
      - 'scripts/build-calamares.sh'
      - 'scripts/installer-*.sh'
      - 'scripts/hardware-detect.sh'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - 'tests/test-installed-qemu.py'
      - 'packages/repo/**'
      - 'packages/keys/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - 'vpkg/**'
      - '.github/workflows/iso.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'calamares/**'
      - 'packaging/calamares/**'
      - 'scripts/build-calamares.sh'
      - 'scripts/installer-*.sh'
      - 'scripts/hardware-detect.sh'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - 'tests/test-installed-qemu.py'
      - 'packages/repo/**'
      - 'packages/keys/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - 'vpkg/**'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
jobs:
  calamares:
    name: Compile Calamares Qt6 package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Build signed Alpine Calamares APK
        run: sh scripts/build-calamares.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-calamares-package
          path: dist/calamares/*
          if-no-files-found: error
          retention-days: 7
  build:
    needs: calamares
    name: Build experimental ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-calamares-package
          path: dist/calamares
      - name: Preflight desktop dependencies
        run: |
          apk update
          grep -vE '^[[:space:]]*(#|$)' images/packages-desktop.txt | grep -vx veyra-calamares | xargs apk add --simulate
      - name: Build development APKs for the live image
        run: |
          apk add --no-cache alpine-sdk go git
          adduser -D builder
          addgroup builder abuild
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.abuild
          chown builder:builder /home/builder/.abuild
          su builder -c 'abuild-keygen -a -n'
          su builder -c "cd '$GITHUB_WORKSPACE' && sh packages/build.sh"
          mkdir -p packages/keys
          cp /home/builder/.abuild/*.rsa.pub packages/keys/veyra-ci.rsa.pub
      - name: Build ISO with Alpine mkimage
        run: sh scripts/build-iso.sh
      - name: Check image structure
        run: |
          test -n "$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.sha256' -print -quit)"
          ls -lh dist/
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sha512
          retention-days: 7
          if-no-files-found: error
  boot:
    name: Boot image in QEMU
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86
          fi
      - name: Boot live ISO and wait for login banner
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          VEYRA_BOOT_TIMEOUT=360 sh scripts/test-iso.sh "$iso" veyra-boot.log
      - name: Save serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-qemu-boot-log
          path: veyra-boot.log
          if-no-files-found: ignore
  install-e2e:
    name: Install on blank QEMU disk and boot it
    needs: boot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        desktop: [plasma, minimal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU and guest console test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect
      - name: Syntax-check console automation
        run: python3 -m py_compile tests/test-installed-qemu.py
      - name: Install ${{ matrix.desktop }} on an isolated virtual disk and reboot
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          python3 tests/test-installed-qemu.py "$iso" --desktop "${{ matrix.desktop }}" --log-dir "e2e-logs/${{ matrix.desktop }}"
      - name: Preserve serial console diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-installed-qemu-console-${{ matrix.desktop }}
          path: e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
