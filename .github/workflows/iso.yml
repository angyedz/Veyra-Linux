name: Veyra ISO
concurrency:
  group: veyra-iso-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'calamares/**'
      - 'packaging/calamares/**'
      - 'scripts/build-calamares.sh'
      - 'scripts/installer-*.sh'
      - 'scripts/hardware-detect.sh'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/verify-iso-artifact.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - 'tests/test-installed-qemu.py'
      - 'tests/diagnose-desktop-qemu.py'
      - 'packages/repo/**'
      - 'packages/keys/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - 'vpkg/**'
      - '.github/workflows/iso.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'calamares/**'
      - 'packaging/calamares/**'
      - 'scripts/build-calamares.sh'
      - 'scripts/installer-*.sh'
      - 'scripts/hardware-detect.sh'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - 'tests/test-installed-qemu.py'
      - 'tests/diagnose-desktop-qemu.py'
      - 'packages/repo/**'
      - 'packages/keys/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - 'vpkg/**'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
jobs:
  calamares:
    name: Compile Calamares Qt6 package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Build signed Alpine Calamares APK
        run: sh scripts/build-calamares.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-calamares-package
          path: dist/calamares/*
          if-no-files-found: error
          retention-days: 7
  glenv-manager:
    name: Build experimental glenv manager for ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: golang:1.23-alpine
    steps:
      - name: Check out tested glenv manager
        uses: actions/checkout@v4
        with:
          repository: angyedz/veyra-glenv
          ref: bdcc0980553a2bc86fd6d62faee26002fea07999
          persist-credentials: false
      - name: Verify Go tests and build static native tool
        run: |
          set -eu
          go test -count=1 ./...
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/glenv-manager ./cmd/glenv
          chmod 755 dist/glenv-manager
          dist/glenv-manager version
          (cd dist && sha256sum glenv-manager > glenv-manager.sha256)
      - name: Upload development manager binary
        uses: actions/upload-artifact@v4
        with:
          name: veyra-glenv-manager
          path: |
            dist/glenv-manager
            dist/glenv-manager.sha256
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [calamares, glenv-manager]
    name: Build experimental ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-calamares-package
          path: dist/calamares
      - name: Download verified development glenv manager
        uses: actions/download-artifact@v4
        with:
          name: veyra-glenv-manager
          path: dist/glenv-manager
      - name: Verify glenv manager artifact before ISO packaging
        run: |
          set -eu
          # Downloaded Actions artifacts do not retain executable modes.
          chmod 755 dist/glenv-manager/glenv-manager
          test -x dist/glenv-manager/glenv-manager
          (cd dist/glenv-manager && sha256sum -c glenv-manager.sha256)
          dist/glenv-manager/glenv-manager version
      - name: Preflight desktop dependencies
        run: |
          apk update
          grep -vE '^[[:space:]]*(#|$)' images/packages-desktop.txt | grep -vx veyra-calamares | xargs apk add --simulate
      - name: Checkout canonical Veyra package sources
        uses: actions/checkout@v4
        with:
          repository: angyedz/veyra-pkgrepo
          path: pkgrepo-source
          persist-credentials: false
      - name: Build development APKs for the live image
        run: |
          apk add --no-cache alpine-sdk go git
          adduser -D builder
          addgroup builder abuild
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.abuild
          chown builder:builder /home/builder/.abuild
          su builder -c 'abuild-keygen -a -n'
          key=$(find /home/builder/.abuild -maxdepth 1 -type f -name '*.rsa' -print -quit)
          test -n "$key"
          printf 'PACKAGER_PRIVKEY=%s\n' "$key" > /home/builder/.abuild/abuild.conf
          chown builder:builder /home/builder/.abuild/abuild.conf
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
          su builder -c "cd '$GITHUB_WORKSPACE' && sh packages/build.sh"
          mkdir -p packages/keys
          cp /home/builder/.abuild/*.rsa.pub packages/keys/veyra-ci.rsa.pub
      - name: Build ISO with Alpine mkimage
        env:
          VEYRA_REQUIRE_GLENV_MANAGER: '1'
        run: sh scripts/build-iso.sh
      - name: Check image structure and checksum
        run: |
          set -eu
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
          ls -lh dist/
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sha512
          retention-days: 7
          if-no-files-found: error
  boot:
    name: Boot image in QEMU
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-utils python3-pexpect
          fi
      - name: Verify downloaded ISO artifact
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
      - name: Boot live ISO and verify Plasma session
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          python3 tests/diagnose-desktop-qemu.py "$iso" --log veyra-live-desktop.log
      - name: Save serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-qemu-boot-log
          path: veyra-live-desktop.log
          if-no-files-found: ignore
  install-e2e:
    name: Install on blank QEMU disk and boot it
    needs: boot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        desktop: [plasma, gnome, xfce, lxqt, minimal]
        firmware: [bios]
        include:
          - desktop: plasma
            firmware: uefi
          - desktop: minimal
            firmware: uefi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU and guest console test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect ovmf
      - name: Verify ISO artifact before installing
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
      - name: Syntax-check console automation
        run: python3 -m py_compile tests/test-installed-qemu.py
      - name: Install ${{ matrix.desktop }} (${{ matrix.firmware }}) on an isolated virtual disk and reboot
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          python3 tests/test-installed-qemu.py "$iso" --desktop "${{ matrix.desktop }}" --firmware "${{ matrix.firmware }}" --log-dir "e2e-logs/${{ matrix.desktop }}/${{ matrix.firmware }}"
      - name: Preserve serial console diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-installed-qemu-console-${{ matrix.desktop }}-${{ matrix.firmware }}
          path: e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
