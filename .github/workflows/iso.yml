name: Veyra ISO
concurrency:
  group: veyra-iso-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
jobs:
  build:
    name: Build experimental ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Preflight desktop dependencies
        run: |
          apk update
          grep -vE '^[[:space:]]*(#|$)' images/packages-desktop.txt | xargs apk add --simulate
      - name: Build ISO with Alpine mkimage
        run: sh scripts/build-iso.sh
      - name: Check image structure
        run: |
          test -n "$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.sha256' -print -quit)"
          ls -lh dist/
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sha512
          retention-days: 7
          if-no-files-found: error
  boot:
    name: Boot image in QEMU
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86
          fi
      - name: Boot live ISO and wait for login banner
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/test-iso.sh "$iso" veyra-boot.log
      - name: Save serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-qemu-boot-log
          path: veyra-boot.log
          if-no-files-found: ignore
