name: Veyra ISO
concurrency:
  group: veyra-iso-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'calamares/**'
      - 'packaging/calamares/**'
      - 'scripts/build-calamares.sh'
      - 'scripts/installer-*.sh'
      - 'scripts/hardware-detect.sh'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/verify-iso-artifact.sh'
      - 'scripts/write-iso-manifest.sh'
      - 'scripts/verify-iso-manifest.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - 'tests/test-installed-qemu.py'
      - 'tests/test-calamares-gui.py'
      - 'tests/test-installer-hardware.sh'
      - 'tests/test-install-selection.sh'
      - 'tests/test-calamares-config.py'
      - 'tests/test-iso.sh'
      - 'tests/test-iso-manifest.sh'
      - 'tests/test-system-packages.sh'
      - 'tests/static.sh'
      - 'deployment/**'
      - 'scripts/build-veyra-init.sh'
      - 'scripts/setup-pkgrepo.sh'
      - 'scripts/veyra-atomic-convert.sh'
      - 'scripts/veyra-boot-confirm.initd'
      - 'scripts/veyra-bootctl.py'
      - 'scripts/veyra-deployment.sh'
      - 'scripts/veyra-initramfs-select.sh'
      - 'scripts/veyra-sddm-runtime.initd'
      - 'tests/test-atomic-qemu.py'
      - 'tests/veyra-trial-failure.initd'
      - 'update/**'
      - '.github/workflows/iso.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'calamares/**'
      - 'packaging/calamares/**'
      - 'scripts/build-calamares.sh'
      - 'scripts/installer-*.sh'
      - 'scripts/hardware-detect.sh'
      - 'scripts/build-iso.sh'
      - 'scripts/test-iso.sh'
      - 'scripts/verify-iso-artifact.sh'
      - 'scripts/write-iso-manifest.sh'
      - 'scripts/verify-iso-manifest.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - 'tests/test-installed-qemu.py'
      - 'tests/test-calamares-gui.py'
      - 'tests/test-installer-hardware.sh'
      - 'tests/test-install-selection.sh'
      - 'tests/test-calamares-config.py'
      - 'tests/test-iso.sh'
      - 'tests/test-iso-manifest.sh'
      - 'tests/test-system-packages.sh'
      - 'tests/static.sh'
      - 'deployment/**'
      - 'scripts/build-veyra-init.sh'
      - 'scripts/setup-pkgrepo.sh'
      - 'scripts/veyra-atomic-convert.sh'
      - 'scripts/veyra-boot-confirm.initd'
      - 'scripts/veyra-bootctl.py'
      - 'scripts/veyra-deployment.sh'
      - 'scripts/veyra-initramfs-select.sh'
      - 'scripts/veyra-sddm-runtime.initd'
      - 'tests/test-atomic-qemu.py'
      - 'tests/veyra-trial-failure.initd'
      - 'update/**'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
jobs:
  calamares:
    name: Build signed Calamares and AppCenter APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Veyra AppCenter source
        uses: actions/checkout@v4
        with:
          repository: angyedz/veyra-pkgrepo
          ref: 97dbd8b8df28e0e4fad66397473bfa2ff62d5532
          path: veyra-pkgrepo
          persist-credentials: false
      - name: Check out pinned Veyra updater package source
        uses: actions/checkout@v4
        with:
          repository: angyedz/veyra-pkgrepo
          ref: e8c5cf68325283eefe28bffb722a649995acd75b
          path: veyra-update-source
          persist-credentials: false
      - name: Build signed Alpine Calamares APK
        env:
          VEYRA_APPCENTER_SOURCE: ${{ github.workspace }}/veyra-pkgrepo
          VEYRA_APPCENTER_REVISION: 97dbd8b8df28e0e4fad66397473bfa2ff62d5532
          VEYRA_UPDATE_SOURCE: ${{ github.workspace }}/veyra-update-source
          VEYRA_UPDATE_REVISION: e8c5cf68325283eefe28bffb722a649995acd75b
        run: sh scripts/build-calamares.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-desktop-packages
          path: dist/calamares/*
          if-no-files-found: error
          retention-days: 7
  glenv-manager:
    name: Build experimental glenv manager for ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: golang:1.23-alpine
    steps:
      - name: Check out tested glenv manager
        uses: actions/checkout@v4
        with:
          repository: angyedz/veyra-glenv
          ref: bdcc0980553a2bc86fd6d62faee26002fea07999
          persist-credentials: false
      - name: Verify Go tests and build static native tool
        run: |
          set -eu
          go test -count=1 ./...
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/glenv-manager ./cmd/glenv
          chmod 755 dist/glenv-manager
          dist/glenv-manager version
          (cd dist && sha256sum glenv-manager > glenv-manager.sha256)
      - name: Upload development manager binary
        uses: actions/upload-artifact@v4
        with:
          name: veyra-glenv-manager
          path: |
            dist/glenv-manager
            dist/glenv-manager.sha256
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [calamares, glenv-manager]
    name: Build experimental ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-desktop-packages
          path: dist/calamares
      - name: Download verified development glenv manager
        uses: actions/download-artifact@v4
        with:
          name: veyra-glenv-manager
          path: dist/glenv-manager
      - name: Verify glenv manager artifact before ISO packaging
        run: |
          set -eu
          # Downloaded Actions artifacts do not retain executable modes.
          chmod 755 dist/glenv-manager/glenv-manager
          test -x dist/glenv-manager/glenv-manager
          (cd dist/glenv-manager && sha256sum -c glenv-manager.sha256)
          dist/glenv-manager/glenv-manager version
      - name: Preflight desktop dependencies
        run: |
          apk update
          grep -vE '^[[:space:]]*(#|$)' images/packages-desktop.txt | grep -vxE 'veyra-calamares|veyra-appcenter|veyra-update' | xargs apk add --simulate
      - name: Build ISO with Alpine mkimage
        env:
          VEYRA_REQUIRE_GLENV_MANAGER: '1'
          VEYRA_VERSION: 0.1.0-alpha.1+${{ github.sha }}
          VEYRA_SOURCE_COMMIT: ${{ github.sha }}
          VEYRA_APPCENTER_REVISION: 97dbd8b8df28e0e4fad66397473bfa2ff62d5532
          VEYRA_UPDATE_REVISION: e8c5cf68325283eefe28bffb722a649995acd75b
          VEYRA_GLENV_REVISION: bdcc0980553a2bc86fd6d62faee26002fea07999
        run: sh scripts/build-iso.sh
      - name: Verify ISO source and package manifest
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          manifest=$(find dist -maxdepth 1 -name 'veyra-linux-*.manifest.txt' -print -quit)
          test -n "$iso"
          test -n "$manifest"
          sh scripts/verify-iso-manifest.sh "$iso" "$manifest"
      - name: Check image structure and checksum
        run: |
          set -eu
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
          ls -lh dist/
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sha512
            dist/*.manifest.txt
          retention-days: 7
          if-no-files-found: error
  boot:
    name: Boot image in QEMU
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU
        run: |
          if ! command -v qemu-system-x86_64 >/dev/null || ! command -v xorriso >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86 xorriso
          fi
      - name: Verify downloaded ISO artifact
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
          sh scripts/verify-iso-manifest.sh "$iso" "${iso%.iso}.manifest.txt"
      - name: Boot live ISO and wait for login banner
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          VEYRA_BOOT_TIMEOUT=360 sh scripts/test-iso.sh "$iso" veyra-boot.log
      - name: Save serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-qemu-boot-log
          path: veyra-boot.log
          if-no-files-found: ignore
  install-e2e:
    name: Install on blank QEMU disk and boot it
    needs: boot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU and guest console test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect xorriso
      - name: Verify ISO artifact before installing
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
          sh scripts/verify-iso-manifest.sh "$iso" "${iso%.iso}.manifest.txt"
      - name: Syntax-check console automation
        run: python3 -m py_compile tests/test-installed-qemu.py
      - name: Install Plasma on an isolated virtual disk and reboot
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          python3 tests/test-installed-qemu.py "$iso" --desktop plasma --log-dir e2e-logs
      - name: Print installation serial diagnostics on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          logs=(e2e-logs/*.log)
          if (( ${#logs[@]} == 0 )); then
            echo "::warning::No installation serial logs were produced"
          fi
          for log in "${logs[@]}"; do
            echo "::group::$log (last 220 lines)"
            tail -n 220 "$log"
            echo "::endgroup::"
          done
      - name: Preserve serial console diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-installed-qemu-console
          path: e2e-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
  atomic-e2e:
    name: Real ext4 paired-generation trial and rollback in QEMU
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU serial and installer test tools
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq qemu-system-x86 qemu-utils python3-pexpect xorriso
      - name: Validate boot automation and current-run ISO checksums
        run: |
          set -eu
          python3 -m py_compile tests/test-atomic-qemu.py tests/test-installed-qemu.py
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
          sh scripts/verify-iso-manifest.sh "$iso" "${iso%.iso}.manifest.txt"
      - name: Real Alpine+Plasma A/B boot and rollback
        shell: bash
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          python3 tests/test-atomic-qemu.py "$iso" --log-dir atomic-qemu-logs
      - name: Print guest serial diagnostics when A/B test fails
        if: failure()
        shell: bash
        run: |
          for log in atomic-qemu-logs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log (last 220 lines)"
            tail -n 220 "$log"
            echo "::endgroup::"
          done
      - name: Preserve A/B GRUB, initramfs and serial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-atomic-qemu-ext4-logs
          path: atomic-qemu-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
  calamares-gui-e2e:
    name: Graphical Calamares install and first Plasma login
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install QEMU and isolated GUI automation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xvfb xdotool imagemagick tesseract-ocr xorriso
      - name: Verify downloaded ISO and embedded package manifest
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          sh scripts/verify-iso-artifact.sh "$iso"
          sh scripts/verify-iso-manifest.sh "$iso" "${iso%.iso}.manifest.txt"
      - name: Install Veyra using Calamares and log into installed Plasma
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          python3 -m py_compile tests/test-calamares-gui.py
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 tests/test-calamares-gui.py "$iso" --output-dir calamares-gui-e2e
      - name: Print Calamares textual diagnostics on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          logs=(calamares-gui-e2e/*.log calamares-gui-e2e/*.txt)
          if (( ${#logs[@]} == 0 )); then
            echo "::warning::No Calamares text diagnostics were produced"
          fi
          for log in "${logs[@]}"; do
            echo "::group::$log (last 220 lines)"
            tail -n 220 "$log"
            echo "::endgroup::"
          done
      - name: Preserve GUI screenshots and QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-calamares-gui-evidence
          path: calamares-gui-e2e/
          if-no-files-found: ignore
          retention-days: 7
  live-desktop-diagnostics:
    name: Collect Live desktop service diagnostics
    if: ${{ always() && needs['calamares-gui-e2e'].result == 'failure' }}
    needs: [build, calamares-gui-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-linux-iso
          path: dist
      - name: Install diagnostic QEMU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect
      - name: Inspect SDDM and Plasma startup from the Live ISO
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          python3 -m py_compile tests/diagnose-desktop-qemu.py tests/test-installed-qemu.py
          python3 tests/diagnose-desktop-qemu.py "$iso" --log veyra-live-desktop.log
      - name: Save Live desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-live-desktop-diagnostics
          path: veyra-live-desktop.log
          retention-days: 7
          if-no-files-found: ignore
