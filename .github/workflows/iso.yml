name: Veyra ISO
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/build-iso.sh'
      - 'scripts/bootstrap.sh'
      - 'scripts/compat.sh'
      - 'scripts/smoke.sh'
      - '.github/workflows/iso.yml'
  workflow_dispatch:
jobs:
  build:
    name: Build experimental ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO with Alpine mkimage
        run: sh scripts/build-iso.sh
      - name: Check image structure
        run: |
          test -n "$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.sha256' -print -quit)"
          ls -lh dist/
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: veyra-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sha512
          retention-days: 7
          if-no-files-found: error
