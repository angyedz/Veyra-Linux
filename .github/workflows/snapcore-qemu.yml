name: Veyra SnapCore ext4 QEMU prototype

on:
  pull_request:
    paths:
      - 'snapcore/**'
      - 'scripts/veyra-snapcore.py'
      - 'tests/fixtures/snapcore-*'
      - 'tests/test-snapcore-ext4-qemu.py'
      - '.github/workflows/snapcore-qemu.yml'
  push:
    branches: [main]
    paths:
      - 'snapcore/**'
      - 'scripts/veyra-snapcore.py'
      - 'tests/fixtures/snapcore-*'
      - 'tests/test-snapcore-ext4-qemu.py'
      - '.github/workflows/snapcore-qemu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ext4-rollback:
    name: ext4 format, mutation and rollback through host kernel NBD across QEMU boots
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU, host kernel NBD, NBDKit and serial assertion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils nbdkit nbdkit-plugin-python python3-pexpect
          nbdkit python --dump-plugin
      - name: Compile SnapCore and QEMU test harness
        run: |
          python3 -m py_compile snapcore/*.py scripts/veyra-snapcore.py \
            tests/fixtures/snapcore-nbdkit-plugin.py tests/test-snapcore-ext4-qemu.py
      - name: Build Alpine guest kernel and ext4-capable initramfs
        run: |
          set -euo pipefail
          mkdir -p /tmp/veyra-snapcore-qemu
          docker run --rm -v "$PWD:/work:ro" -v /tmp/veyra-snapcore-qemu:/out \
            alpine:3.22 sh /work/tests/fixtures/build-snapcore-ext4-initramfs.sh /out
      - name: Run ext4 checkpoint, mutation and rollback through host kernel NBD and QEMU
        run: |
          python3 tests/test-snapcore-ext4-qemu.py \
            /tmp/veyra-snapcore-qemu/snapcore-ext4-kernel \
            /tmp/veyra-snapcore-qemu/snapcore-ext4-initramfs \
            --log /tmp/veyra-snapcore-qemu/serial.log
      - name: Print guest serial errors
        if: failure()
        run: |
          test ! -s /tmp/veyra-snapcore-qemu/serial.log || \
            tail -n 200 /tmp/veyra-snapcore-qemu/serial.log
      - name: Save QEMU serial proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-snapcore-ext4-serial
          path: /tmp/veyra-snapcore-qemu/serial.log
          retention-days: 7
          if-no-files-found: ignore
