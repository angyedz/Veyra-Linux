name: Veyra E2E (cached ISO)
concurrency:
  group: veyra-e2e-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - 'tests/test-installed-qemu.py'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  install:
    name: Install onto blank virtual disk and boot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # Avoid a pinned run ID: ISO artifacts expire after seven days.
      # Only trust artifacts produced by a Veyra ISO build on main.
      - name: Find the newest unexpired main-branch ISO
        id: iso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=veyra-linux-iso&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "No unexpired main-branch Veyra ISO artifact found." >&2
            exit 1
          fi
          echo "Using ISO artifact from run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the latest main-branch ISO artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.iso.outputs.run_id }}
          github-token: ${{ github.token }}
          name: veyra-linux-iso
          path: dist
      - name: Install virtual machine test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect
      - name: Check test script
        run: python3 -m py_compile tests/test-installed-qemu.py
      - name: Install into isolated QEMU disk and reboot
        run: |
          iso=$(find dist -maxdepth 1 -name 'veyra-linux-*.iso' -print -quit)
          test -n "$iso"
          python3 tests/test-installed-qemu.py "$iso" --desktop plasma --log-dir e2e-logs
      - name: Upload guest serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyra-e2e-cached-iso-logs
          path: e2e-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
