name: Veyra integration CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and image overlay
        run: sh tests/static.sh
      - name: Test ISO artifact integrity verifier
        run: sh tests/test-iso-artifact.sh
  alpine-smoke:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: apk add --no-cache shellcheck python3 py3-yaml
      - name: ShellCheck
        run: shellcheck -s sh scripts/*.sh images/*.sh tests/*.sh
      - name: Validate shell and image overlay
        run: sh tests/static.sh
      - name: Test ISO artifact integrity verifier on Alpine
        run: sh tests/test-iso-artifact.sh
      - name: Validate Calamares settings and modules
        run: python3 tests/test-calamares-config.py
      - name: CPU and graphics detection fixtures
        run: sh tests/test-hardware.sh
      - name: Desktop installation script routing (mocked commands)
        run: sh tests/test-install-selection.sh
      - name: Refresh repository indexes for dependency simulations
        run: apk update
      - name: Validate alternative desktops in Alpine repositories
        run: |
          apk add --simulate gnome gdm gdm-openrc
          apk add --simulate xfce4 xfce4-terminal lightdm lightdm-openrc lightdm-gtk-greeter
          apk add --simulate lxqt-desktop qterminal openbox sddm sddm-openrc
          apk add --simulate plasma-desktop gnome gdm gdm-openrc
          apk add --simulate plasma-desktop xfce4 lightdm lightdm-openrc
          apk add --simulate plasma-desktop lxqt-desktop sddm
      - name: Validate GPU and CPU packages in Alpine repositories
        run: |
          apk add --simulate intel-ucode linux-firmware-i915 linux-firmware-xe mesa-vulkan-intel intel-media-driver
          apk add --simulate amd-ucode linux-firmware-amdgpu linux-firmware-radeon mesa-vulkan-ati
          apk add --simulate linux-firmware-nvidia mesa-vulkan-nouveau
      - name: Verify native Nix package availability
        run: apk add --no-cache nix nix-openrc && nix --version

  signed-pkgrepo:
    name: Install signed Veyra packages on clean Alpine
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Trust pinned Veyra key and configure APK repository
        run: sh scripts/setup-pkgrepo.sh
      - name: Install vpkg and veyra-glenv using verified APK signatures
        run: |
          apk update
          apk add --no-cache vpkg veyra-glenv
          command -v vpkg
          command -v veyra-glenv
          apk info -e vpkg
          apk info -e veyra-glenv
          vpkg --help
      - name: Install the signed Veyra desktop and AppCenter
        run: |
          set -eu
          apk add --no-cache veyra-meta veyra-appcenter
          apk info -e veyra-meta
          apk info -e veyra-appcenter
          command -v veyra-appcenter
          test -s /usr/share/veyra/appcenter/main.qml
          test -s /usr/share/veyra/appcenter/backend.py
      - name: Launch signed AppCenter from APK installation
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 6s veyra-appcenter > /tmp/veyra-signed-appcenter.log 2>&1
          result=$?
          set -e
          cat /tmp/veyra-signed-appcenter.log
          grep -q 'VEYRA_QML_READY' /tmp/veyra-signed-appcenter.log
          test "$result" -eq 124 || test "$result" -eq 143

  glenv-musl:
    name: glenv compatibility build (musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: golang:1.23-alpine
    steps:
      - name: Check out Veyra integration scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned glenv source
        uses: actions/checkout@v4
        with:
          repository: angyedz/veyra-glenv
          ref: ea430a4c3a5d9443fc03d20fdc38d95c9b1f3275
          path: glenv
          persist-credentials: false
      - name: Verify glenv Go packages under musl
        working-directory: glenv
        run: go test -count=1 ./...
      - name: Build glenv native tool
        working-directory: glenv
        run: go build -trimpath -o /tmp/glenv ./cmd/glenv
      - name: Check native binary and CLI
        run: |
          /tmp/glenv version
          /tmp/glenv inspect /bin/busybox
      - name: Exercise Veyra/glenv atomic boot binding
        run: |
          set -eu
          mkdir -p /tmp/veyra-glenv-fixture/sysroot
          printf 'fixture' > /tmp/veyra-glenv-fixture/sysroot/libc.so
          /tmp/glenv release inventory /tmp/veyra-glenv-fixture ci-runtime > /tmp/veyra-glenv-fixture/glenv-manifest.json
          /tmp/glenv release --store /tmp/veyra-glenv-store stage /tmp/veyra-glenv-fixture ci-runtime
          /tmp/glenv release --store /tmp/veyra-glenv-store bind-host veyra-ci ci-runtime
          if /tmp/glenv release --store /tmp/veyra-glenv-store boot-pin foreign-host /tmp/veyra-boot/glenv; then
            echo 'Boot binding accepted the wrong Veyra deployment' >&2
            exit 1
          fi
          /tmp/glenv release --store /tmp/veyra-glenv-store boot-pin veyra-ci /tmp/veyra-boot/glenv
          test "$(basename "$(readlink /tmp/veyra-boot/glenv)")" = ci-runtime
          /tmp/glenv release --store /tmp/veyra-glenv-store boot-pin veyra-ci /tmp/veyra-user-boot/glenv
          test "$(readlink /tmp/veyra-boot/glenv)" = "$(readlink /tmp/veyra-user-boot/glenv)"
          printf '%s\n' veyra-ci > /tmp/veyra-deployment-id
          VEYRA_DEPLOYMENT_ID_FILE=/tmp/veyra-deployment-id \
          VEYRA_GLENV_STORE=/tmp/veyra-glenv-store \
          VEYRA_GLENV_PIN=/tmp/veyra-boot/glenv \
          VEYRA_GLENV_BIN=/tmp/glenv \
            sh scripts/glenv-boot-pin.sh
          test "$(basename "$(readlink /tmp/veyra-boot/glenv)")" = ci-runtime
