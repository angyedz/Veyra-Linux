name: Veyra native packages
on:
  push:
    branches: [main]
    paths:
      - 'vpkg/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'vpkg/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vpkg/go.mod
      - run: cd vpkg && go test ./... && go vet ./...
  build:
    permissions:
      contents: read
    outputs:
      stable_signing: ${{ steps.sign.outputs.stable }}
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache alpine-sdk go git
      - name: Prepare unprivileged Alpine builder
        run: |
          adduser -D builder
          addgroup builder abuild
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.abuild
          chown builder:builder /home/builder/.abuild
      - name: Configure stable signing key for main publication
        id: sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VEYRA_KEY_B64: ${{ secrets.VEYRA_ABUILD_PRIVATE_KEY_B64 }}
          VEYRA_PUB_B64: ${{ secrets.VEYRA_ABUILD_PUBLIC_KEY_B64 }}
        run: |
          if [ -n "$VEYRA_KEY_B64" ] && [ -n "$VEYRA_PUB_B64" ]; then
            printf '%s' "$VEYRA_KEY_B64" | base64 -d > /home/builder/.abuild/veyra.rsa
            printf '%s' "$VEYRA_PUB_B64" | base64 -d > /home/builder/.abuild/veyra.rsa.pub
            chmod 600 /home/builder/.abuild/veyra.rsa
            chown -R builder:builder /home/builder/.abuild
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          else
            su builder -c 'abuild-keygen -a -n'
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          fi
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
          mkdir -p packages/keys
          cp /home/builder/.abuild/*.rsa.pub packages/keys/veyra.rsa.pub
      - name: Generate an ephemeral key for non-main builds
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          su builder -c 'abuild-keygen -a -n'
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
          mkdir -p packages/keys
          cp /home/builder/.abuild/*.rsa.pub packages/keys/veyra.rsa.pub
      - name: Compile Veyra APKs
        run: su builder -c "cd '$GITHUB_WORKSPACE' && sh packages/build.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-native-apks
          path: |
            packages/repo/x86_64/*.apk
            packages/repo/x86_64/APKINDEX.tar.gz
            packages/keys/veyra.rsa.pub
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.stable_signing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-native-apks
          path: packages
      - name: Publish signed packages and public key
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/repo/x86_64 packages/keys/veyra.rsa.pub
          if git diff --cached --quiet; then
            echo 'No binary package changes'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "packages: publish signed vpkg and glenv APKs"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Start ISO and QEMU validation for the published repository
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/angyedz/Veyra-Linux/actions/workflows/iso.yml/dispatches \
            -d '{"ref":"main"}'
