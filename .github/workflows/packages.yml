name: Veyra native packages
on:
  push:
    branches: [main]
    paths:
      - 'vpkg/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'vpkg/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vpkg/go.mod
      - run: cd vpkg && go test ./... && go vet ./...
  build:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache alpine-sdk go git
      - name: Prepare temporary build signing key
        run: |
          mkdir -p /root/.abuild
          abuild-keygen -a -i -n
      - name: Compile Veyra APKs
        run: sh packages/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-native-apks
          path: packages/repo/x86_64/*.apk
          if-no-files-found: error
          retention-days: 7
