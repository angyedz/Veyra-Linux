name: Veyra native packages
on:
  push:
    branches: [main]
    paths:
      - 'vpkg/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - '.github/workflows/packages.yml'
  pull_request:
    paths:
      - 'vpkg/**'
      - 'packages/src/**'
      - 'packages/build.sh'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: vpkg/go.mod
      - run: cd vpkg && go test ./... && go vet ./...
  build:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apk add --no-cache alpine-sdk go git
      - name: Prepare unprivileged Alpine builder and signing key
        env:
          VEYRA_KEY_B64: ${{ secrets.VEYRA_ABUILD_PRIVATE_KEY_B64 }}
          VEYRA_PUB_B64: ${{ secrets.VEYRA_ABUILD_PUBLIC_KEY_B64 }}
        run: |
          adduser -D builder
          addgroup builder abuild
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.abuild
          if [ -n "$VEYRA_KEY_B64" ] && [ -n "$VEYRA_PUB_B64" ]; then
            printf '%s' "$VEYRA_KEY_B64" | base64 -d > /home/builder/.abuild/veyra.rsa
            printf '%s' "$VEYRA_PUB_B64" | base64 -d > /home/builder/.abuild/veyra.rsa.pub
            chmod 600 /home/builder/.abuild/veyra.rsa
            chown -R builder:builder /home/builder/.abuild
            echo "stable" > /tmp/veyra-signing-mode
          else
            su builder -c 'abuild-keygen -a -n'
            echo "ephemeral" > /tmp/veyra-signing-mode
          fi
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
      - name: Compile Veyra APKs
        run: su builder -c "cd '$GITHUB_WORKSPACE' && sh packages/build.sh"
      - name: Publish stable-key signed binaries into this repository
        if: github.event_name == 'push'
        run: |
          if [ "$(cat /tmp/veyra-signing-mode)" != stable ]; then
            echo 'Stable signing secrets absent: APKs uploaded as CI artifacts only.'
            exit 0
          fi
          mkdir -p packages/keys
          cp /home/builder/.abuild/veyra.rsa.pub packages/keys/veyra.rsa.pub
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/repo/x86_64 packages/keys/veyra.rsa.pub
          if git diff --cached --quiet; then
            echo 'No binary package changes'
            exit 0
          fi
          git commit -m "packages: publish signed vpkg and glenv APKs [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-native-apks
          path: |
            packages/repo/x86_64/*.apk
            packages/repo/x86_64/APKINDEX.tar.gz
          if-no-files-found: error
          retention-days: 7
