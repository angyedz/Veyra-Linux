name: Build Calamares
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v4
      - name: Build Calamares native Alpine package
        run: sh scripts/build-calamares.sh
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: veyra-calamares-apk
          path: dist/calamares/*
          if-no-files-found: error
          retention-days: 7
